<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc"><title id="title">Atharva Shrikant — Ideas deserve experiments.</title><desc id="desc">A custom research lab masthead with a geometric network inside intersecting orbits. Machine learning, quantum, and systems.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#DCE5D5" stroke-opacity=".055"/></pattern></defs><rect width="1280" height="520" rx="24" fill="#111713"/><rect width="1280" height="520" rx="24" fill="url(#grid)"/><path d="M46 46H86M46 46V86M1234 46H1194M1234 46V86M46 474H86M46 474V434M1234 474H1194M1234 474V434" stroke="#C7F464" stroke-width="2" fill="none"/><text x="72" y="84" fill="#A8B6A7" font-family="Courier New, monospace" font-size="16" font-weight="400" letter-spacing="2">ATHARVA SHRIKANT / PERSONAL RESEARCH LAB</text><text x="68" y="196" fill="#F3F1E8" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Ideas deserve</text><text x="68" y="282" fill="#C7F464" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">experiments.</text><text x="72" y="338" fill="#F3F1E8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" >I build models, trace the mechanics,</text><text x="72" y="372" fill="#F3F1E8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" >and turn the interesting parts into systems.</text><text x="72" y="452" fill="#A8B6A7" font-family="Courier New, monospace" font-size="16" font-weight="400" >MACHINE LEARNING  /  QUANTUM  /  SYSTEMS</text><g transform="translate(1000 247)"><circle r="155" stroke="#53624E" stroke-width="1" fill="none"/><circle r="112" stroke="#53624E" stroke-width="1" stroke-dasharray="4 10" fill="none"/><ellipse rx="164" ry="58" transform="rotate(-35)" stroke="#C7F464" stroke-opacity=".65" fi